name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NxForge-Studio-project.zip
      - run: brew install xcodegen && xcodegen generate
        working-directory: NusaLibrary
      - run: xcodebuild -project NusaLibrary.xcodeproj -scheme NusaLibrary -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
        working-directory: NusaLibrary
      - run: mkdir Payload && cp -R build/Build/Products/Release-iphoneos/NusaLibrary.app Payload/ && zip -qr NxForge-Studio.ipa Payload
        working-directory: NusaLibrary
      - uses: actions/upload-artifact@v4
        with:
          name: NxForge-Studio-ipa
          path: NusaLibrary/NxForge-Studio.ipa
